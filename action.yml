name: 'StackHawk HawkScan Action'
description: 'Find security bugs in your application with HawkScan DAST'
author: 'Zachary Conger'

inputs:
  apiKey:
    description: StackHawk API key
    required: true
  args:
    description: Arguments to be passed to the scan as a multi line option
    required: false
  command:
    description: Command to be passed to HawkScan
    default: scan
    required: false
  dryRun:
    description: If set to `true`, show HawkScan commands, but don't run them
    required: false
    default: false
  workspace:
    description: Working directory accessed by HawkScan including configuration files
    required: false
    default: ${{ github.workspace }}
  configurationFiles:
    description: Space-separated list of HawkScan configuration files to use
    required: false
    default: stackhawk.yml
  codeScanningAlerts:
    description: DEPRECATED - pass `--sarif-ghas` in `args` and upload `stackhawk-ghas.sarif` with `github/codeql-action/upload-sarif` instead. If `true`, Register a Code Scanning Alert in GitHub if scan alerts exceed `hawk.failureThreshold`
    required: false
    default: false
    deprecationMessage: '`codeScanningAlerts` is deprecated and will be removed in a future release. Pass `--sarif-ghas` in `args` and upload `stackhawk-ghas.sarif` with `github/codeql-action/upload-sarif` instead. See https://docs.stackhawk.com/integrations/ci-cd/github-actions/github-code-scanning/#upload-individual-findings-as-sarif'
  commitShaCheck:
    description: If `true`, check the StackHawk platform for existing scan results matching the commit SHA before running a new scan
    required: false
    default: false
  githubToken:
    description: GitHub Token for uploading Code Scanning Alert info - required if the deprecated `codeScanningAlerts` is enabled
    required: false
    default: ${{ github.token }}
  installCLIOnly:
    description: If `true` the action will only install the CLI and not run a scan
    required: false
    default: false
  sourceURL:
    description: Source for ZIP file
    required: false
    default: https://download.stackhawk.com/hawk/cli
  version:
    description: HawkScan CLI version to use
    required: false
    default: latest
  verbose:
    description: HawkScan CLI verbose log output flag
    required: false
    default: false
  debug:
    description: HawkScan CLI debug log output flag
    required: false
    default: false

runs:
  using: node24
  main: dist/index.js

branding:
  icon: 'octagon'
  color: 'green'
